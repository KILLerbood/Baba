<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الغرف | Rooms | نور</title>
<meta name="description" content="بيتك غرفة غرفة: شاهد إمكانيات نور في كل غرفة.">
<meta name="theme-color" content="#14110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
</head>
<body data-page="rooms" class="inner">

<section class="page-head"><div class="wrap"><h1 data-i18n="rooms.title"></h1><p data-i18n="rooms.sub"></p></div></section>
<main>
  <section class="section"><div class="wrap"><div class="rooms" id="roomsGrid"></div></div></section>
</main>
<div class="modal" id="roomModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-x" data-close type="button" aria-label="close">×</button>
    <div class="viewer" id="viewer">
      <div class="viewer-img" id="viewerImg"></div>
      <button class="arrow prev" id="vPrev" type="button" aria-label="previous"><span></span></button>
      <button class="arrow next" id="vNext" type="button" aria-label="next"><span></span></button>
      <p class="viewer-hint" data-i18n="rooms.hint"></p>
    </div>
    <div class="viewer-info" id="viewerInfo"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
