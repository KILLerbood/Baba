<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نور | Noor — تصنيع وتنجيد الأثاث في الكويت</title>
<meta name="description" content="نور: تصنيع وتنجيد كنب وكراسي وطاولات وسراير وستاير وحيطان في الكويت. Furniture making and upholstery in Kuwait.">
<meta name="theme-color" content="#14110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="noor-mark" viewBox="0 0 48 48">
    <path d="M10 43V23a14 14 0 0 1 28 0v20z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="24" cy="23" r="5" fill="currentColor"/>
    <path d="M24 8V4M13 12l-2.5-2.5M35 12l2.5-2.5M7 23H3.5M44.5 23H41" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
</svg>

<header class="site-header" id="top">
  <a class="brand" href="#top" aria-label="نور Noor">
    <svg class="brand-mark"><use href="#noor-mark"/></svg>
    <span class="brand-name">نور</span>
  </a>
  <nav class="nav" id="nav">
    <a href="#about" data-i18n="nav.about"></a>
    <a href="#process" data-i18n="nav.process"></a>
    <a href="#rooms" data-i18n="nav.rooms"></a>
    <a href="#fabrics" data-i18n="nav.fabrics"></a>
    <a href="#catalog" data-i18n="nav.catalog"></a>
    <a href="#build" data-i18n="nav.build"></a>
  </nav>
  <div class="header-actions">
    <button class="lang-btn" id="langBtn" type="button" data-i18n="lang.toggle"></button>
    <a class="btn btn-gold btn-sm" href="#request" data-i18n="nav.request"></a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="menu"><span></span><span></span></button>
  </div>
</header>

<!-- HERO: scroll-scrubbed entry scene -->
<section class="hero" id="hero">
  <div class="hero-stage">
    <div class="hero-frames" id="heroFrames"></div>
    <div class="hero-glow"></div>
    <div class="hero-vignette"></div>
    <div class="hero-copy" id="heroCopy">
      <p class="kicker" data-i18n="hero.kicker"></p>
      <h1 class="hero-title"><svg class="hero-mark"><use href="#noor-mark"/></svg><span data-i18n="hero.title"></span></h1>
      <p class="hero-sub" data-i18n="hero.sub"></p>
      <a class="btn btn-gold" href="#request" data-i18n="hero.cta"></a>
    </div>
    <div class="scroll-cue" id="scrollCue"><span data-i18n="hero.scroll"></span><i></i></div>
  </div>
</section>

<main>
<section class="section" id="about">
  <div class="wrap narrow reveal">
    <h2 data-i18n="about.title"></h2>
    <p class="lead" data-i18n="about.text"></p>
    <ul class="chips">
      <li data-i18n="about.w1"></li><li data-i18n="about.w2"></li><li data-i18n="about.w3"></li><li data-i18n="about.w4"></li>
    </ul>
  </div>
</section>

<section class="section alt" id="process">
  <div class="wrap">
    <div class="sec-head reveal"><h2 data-i18n="process.title"></h2><p data-i18n="process.sub"></p></div>
    <ol class="steps" id="steps"></ol>
  </div>
</section>

<section class="section" id="rooms">
  <div class="wrap">
    <div class="sec-head reveal"><h2 data-i18n="rooms.title"></h2><p data-i18n="rooms.sub"></p></div>
    <div class="rooms" id="roomsGrid"></div>
  </div>
</section>

<section class="section alt" id="fabrics">
  <div class="wrap">
    <div class="sec-head reveal"><h2 data-i18n="fabrics.title"></h2><p data-i18n="fabrics.sub"></p></div>
    <div class="fabrics" id="fabricsGrid"></div>
    <p class="note reveal" data-i18n="fabrics.note"></p>
  </div>
</section>

<section class="section" id="catalog">
  <div class="wrap">
    <div class="sec-head reveal"><h2 data-i18n="catalog.title"></h2><p data-i18n="catalog.sub"></p></div>
    <div class="tabs" id="catTabs" role="tablist"></div>
    <div class="slider reveal" id="slider">
      <button class="arrow prev" id="prevBtn" type="button" aria-label="previous"><span></span></button>
      <div class="slide-view" id="slideView"></div>
      <button class="arrow next" id="nextBtn" type="button" aria-label="next"><span></span></button>
    </div>
    <div class="dots" id="dots"></div>
  </div>
</section>

<section class="section alt" id="build">
  <div class="wrap">
    <div class="sec-head reveal"><h2 data-i18n="build.title"></h2><p data-i18n="build.sub"></p></div>
    <div class="builder reveal">
      <div class="build-stage" id="buildStage"></div>
      <div class="build-panel">
        <ol class="build-steps" id="buildSteps"></ol>
        <div class="build-options" id="buildOptions"></div>
        <div class="build-summary" id="buildSummary"></div>
        <button class="btn btn-gold" id="buildSend" type="button" data-i18n="build.send"></button>
      </div>
    </div>
  </div>
</section>

<section class="section" id="request">
  <div class="wrap narrow">
    <div class="sec-head reveal"><h2 data-i18n="form.title"></h2><p data-i18n="form.sub"></p></div>
    <form class="form reveal" id="reqForm" novalidate>
      <label><span data-i18n="form.what"></span>
        <select id="fType"></select></label>
      <label><span data-i18n="form.desc"></span>
        <textarea id="fDesc" rows="3" data-i18n-ph="form.desc.ph"></textarea></label>
      <fieldset class="measure">
        <legend data-i18n="form.measure"></legend>
        <label class="radio"><input type="radio" name="hasM" value="yes"> <span data-i18n="form.yes"></span></label>
        <label class="radio"><input type="radio" name="hasM" value="no" checked> <span data-i18n="form.no"></span></label>
        <div class="dims" id="dims" hidden>
          <label><span data-i18n="form.w"></span><input id="fW" inputmode="numeric"></label>
          <label><span data-i18n="form.h"></span><input id="fH" inputmode="numeric"></label>
          <label><span data-i18n="form.d"></span><input id="fD" inputmode="numeric"></label>
        </div>
      </fieldset>
      <label><span data-i18n="form.fabric"></span><select id="fFabric"></select></label>
      <div class="row">
        <label><span data-i18n="form.name"></span><input id="fName" autocomplete="name"></label>
        <label><span data-i18n="form.phone"></span><input id="fPhone" inputmode="tel" autocomplete="tel" dir="ltr"></label>
      </div>
      <label><span data-i18n="form.area"></span><input id="fArea"></label>
      <input type="hidden" id="fBuild">
      <p class="form-msg" id="formMsg" role="status"></p>
      <button class="btn btn-gold btn-lg" type="submit"><svg class="wa-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg><span data-i18n="form.send"></span></button>
    </form>
  </div>
</section>
</main>

<footer class="footer">
  <svg class="brand-mark"><use href="#noor-mark"/></svg>
  <p data-i18n="foot.text"></p>
  <a href="admin/" class="foot-admin" data-i18n="foot.admin"></a>
</footer>

<a class="wa-float" id="waFloat" href="#request" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg>
</a>

<!-- Room viewer modal -->
<div class="modal" id="roomModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-x" data-close type="button" aria-label="close">×</button>
    <div class="viewer" id="viewer">
      <div class="viewer-img" id="viewerImg"></div>
      <div class="hotspots" id="hotspots"></div>
      <button class="arrow prev" id="vPrev" type="button" aria-label="previous"><span></span></button>
      <button class="arrow next" id="vNext" type="button" aria-label="next"><span></span></button>
      <p class="viewer-hint" data-i18n="rooms.hint"></p>
    </div>
    <div class="viewer-info" id="viewerInfo"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
