<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ركّب قطعتك | Build yours | نور</title>
<meta name="description" content="ركّب قطعتك: اختر الخشب والسفنج والقماش واللون.">
<meta name="theme-color" content="#14110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
</head>
<body data-page="build" class="inner">

<section class="page-head"><div class="wrap"><h1 data-i18n="build.title"></h1><p data-i18n="build.sub"></p></div></section>
<main>
  <section class="section">
    <div class="wrap">
      <div class="builder">
        <div class="build-stage" id="buildStage"></div>
        <div class="build-panel">
          <ol class="build-steps" id="buildSteps"></ol>
          <div class="build-options" id="buildOptions"></div>
          <div class="build-summary" id="buildSummary"></div>
          <button class="btn btn-gold" id="buildSend" type="button" data-i18n="build.go"></button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
