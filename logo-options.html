<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختيار لوجو نور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Cairo,sans-serif;background:#f6efe4;color:#2a241e;padding:32px 16px}
h1{text-align:center;margin-bottom:6px}p.s{text-align:center;color:#7b6f62;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:1100px;margin:auto}
.card{border-radius:20px;overflow:hidden;box-shadow:0 18px 50px -20px rgba(20,17,15,.5)}
.dark{background:#14110f;color:#e2c27a;display:grid;place-items:center;gap:8px;padding:44px 20px;min-height:210px}
.light{background:#fffaf0;color:#14110f;display:flex;align-items:center;justify-content:center;gap:10px;padding:18px}
.label{padding:14px;text-align:center;background:#efe5d4;font-weight:800}
.name{font-size:2.6rem;font-weight:800;line-height:1}.en{font-family:"Cormorant Garamond",serif;letter-spacing:.35em;font-size:1rem;opacity:.85}
svg{width:84px;height:84px}.small svg{width:34px;height:34px}
</style>
</head>
<body>
<h1>اختر لوجو "نور"</h1><p class="s">قول لي الرقم اللي عاجبك: ١ أو ٢ أو ٣</p>
<div class="grid">

<div class="card">
  <div class="dark">
    <svg viewBox="0 0 48 48"><path d="M10 43V23a14 14 0 0 1 28 0v20z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="24" cy="23" r="5" fill="currentColor"/><path d="M24 8V4M13 12l-2.5-2.5M35 12l2.5-2.5M7 23H3.5M44.5 23H41" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <div class="name">نور</div><div class="en">NOOR</div>
  </div>
  <div class="light small"><svg viewBox="0 0 48 48"><path d="M10 43V23a14 14 0 0 1 28 0v20z" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="24" cy="23" r="5" fill="currentColor"/></svg><b style="font-size:1.5rem">نور</b></div>
  <div class="label">١ · نافذة مضيئة (المستخدم حاليًا)</div>
</div>

<div class="card">
  <div class="dark">
    <svg viewBox="0 0 48 48"><path d="M6 30c0-4 3-7 7-7h22c4 0 7 3 7 7v6H6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M10 23v-6a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 36v4M36 36v4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M24 4v3M17 6l1.5 2.5M31 6l-1.5 2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <div class="name">نور</div><div class="en">NOOR</div>
  </div>
  <div class="light small"><svg viewBox="0 0 48 48"><path d="M6 30c0-4 3-7 7-7h22c4 0 7 3 7 7v6H6z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M10 23v-6a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg><b style="font-size:1.5rem">نور</b></div>
  <div class="label">٢ · كنبة مع شعاع</div>
</div>

<div class="card">
  <div class="dark">
    <svg viewBox="0 0 48 48"><path d="M24 4l17 20-17 20L7 24z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 14l8 10-8 10-8-10z" fill="currentColor"/></svg>
    <div class="name">نور</div><div class="en">NOOR</div>
  </div>
  <div class="light small"><svg viewBox="0 0 48 48"><path d="M24 4l17 20-17 20L7 24z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M24 14l8 10-8 10-8-10z" fill="currentColor"/></svg><b style="font-size:1.5rem">نور</b></div>
  <div class="label">٣ · ماسة هندسية</div>
</div>

</div>
</body>
</html>
