<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطلب الآن | Request | نور</title>
<meta name="description" content="اطلب ما تريد بناءه وسيصلنا الطلب على واتساب.">
<meta name="theme-color" content="#14110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
</head>
<body data-page="request" class="inner">

<section class="page-head"><div class="wrap"><h1 data-i18n="form.title"></h1><p data-i18n="form.sub"></p></div></section>
<main>
  <section class="section">
    <div class="wrap narrow">
      <form class="form" id="reqForm" novalidate>
        <p class="build-note" id="buildNote" hidden></p>
        <label><span data-i18n="form.what"></span><select id="fType"></select></label>
        <label><span data-i18n="form.desc"></span><textarea id="fDesc" rows="3" data-i18n-ph="form.desc.ph"></textarea></label>
        <fieldset class="measure">
          <legend data-i18n="form.measure"></legend>
          <label class="radio"><input type="radio" name="hasM" value="yes"> <span data-i18n="form.yes"></span></label>
          <label class="radio"><input type="radio" name="hasM" value="no" checked> <span data-i18n="form.no"></span></label>
          <div class="dims" id="dims" hidden>
            <label><span data-i18n="form.w"></span><input id="fW" inputmode="numeric"></label>
            <label><span data-i18n="form.h"></span><input id="fH" inputmode="numeric"></label>
            <label><span data-i18n="form.d"></span><input id="fD" inputmode="numeric"></label>
          </div>
        </fieldset>
        <label><span data-i18n="form.fabric"></span><select id="fFabric"></select></label>
        <div class="row">
          <label><span data-i18n="form.name"></span><input id="fName" autocomplete="name"></label>
          <label><span data-i18n="form.phone"></span><input id="fPhone" inputmode="tel" autocomplete="tel" dir="ltr"></label>
        </div>
        <label><span data-i18n="form.area"></span><input id="fArea"></label>
        <input type="hidden" id="fBuild">
        <p class="form-msg" id="formMsg" role="status"></p>
        <button class="btn btn-gold btn-lg" type="submit"><svg class="wa-ico" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg><span data-i18n="form.send"></span></button>
      </form>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
