<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكتالوج | Catalog | نور</title>
<meta name="description" content="كتالوج أمثلة من أعمال نور.">
<meta name="theme-color" content="#14110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
</head>
<body data-page="catalog" class="inner">

<section class="page-head"><div class="wrap"><h1 data-i18n="catalog.title"></h1><p data-i18n="catalog.sub"></p></div></section>
<main>
  <section class="section">
    <div class="wrap">
      <div class="tabs" id="catTabs" role="tablist"></div>
      <div class="slider" id="slider">
        <button class="arrow prev" id="prevBtn" type="button" aria-label="previous"><span></span></button>
        <div class="slide-view" id="slideView"></div>
        <button class="arrow next" id="nextBtn" type="button" aria-label="next"><span></span></button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
